# Redrob Film real-world media corpus (gaps.md G6). Human guide: docs/corpus.md.
#
# One [[media]] table per file. Read by scripts/corpus.py (generates the `small` and `large`
# tiers with ffmpeg as a black box) and by the acceptance harness
# crates/engine/src/corpus_tests.rs (import -> cut, move, effect -> export -> ffprobe).
# Keep to the subset the harness parser reads: [[media]] headers, `key = "basic string"`,
# integers, booleans and # comments. No arrays, no inline tables, no single-quoted strings.
#
# Fields
#   id        unique name
#   kind      phone | camera | cinema | screen | audio | container | multitrack | still | damaged
#   title     what the file stands for in the real world
#   codec     video codec / profile ("-" for none), then audio codec
#   container file format
#   tier      small = generated by scripts/corpus.py, < 2 MB; large = generated locally (too big for CI);
#             real = a camera / phone original that ffmpeg cannot make, supplied by a person
#   file      path under the corpus directory ($REDROB_FILM_CORPUS)
#   video     the file has a picture stream we must import
#   audio     the file has a sound stream we must import
#   expect    pass   = the whole round trip must succeed (a failure fails the test)
#             error  = import or export must fail with an error, never a panic
#             report = run and report the outcome, never fail the job (known gaps, issues)
#   issue     the issue or gaps.md entry this file tracks
#   generate  ffmpeg arguments (after `ffmpeg -y`, before the output path). {V} = testsrc2
#             picture, {A} = 1 kHz sine, {S} = seconds; {size} {fps} {rate} come from the entry
#             (defaults 640x360, 30, 48000, 2 s)
#   post      after generating: rotate:<deg> | truncate:<fraction> | flip:<seed>:<count> | zero |
#             random:<bytes>
#   obtain    how a person gets a real file (tier = real)
#   sha256    optional pin for a supplied file; scripts/corpus.py verify checks it

# ---------------------------------------------------------------------------------------------
# Phones
# ---------------------------------------------------------------------------------------------

[[media]]
id = "iphone_hevc_hlg"
kind = "phone"
title = "iPhone HDR video (HEVC Main 10, HLG, BT.2020)"
codec = "hevc Main 10 / aac"
container = "mov"
tier = "small"
file = "phone/iphone_hevc_hlg.mov"
video = true
audio = true
expect = "pass"
issue = "#480"
generate = "{V} {A} -vf format=yuv420p10le -c:v libx265 -preset ultrafast -x265-params log-level=error:colorprim=bt2020:transfer=arib-std-b67:colormatrix=bt2020nc -tag:v hvc1 -color_primaries bt2020 -color_trc arib-std-b67 -colorspace bt2020nc -c:a aac -ac 2 -shortest"

[[media]]
id = "iphone_hevc_sdr_vfr_rotated"
kind = "phone"
title = "iPhone SDR clip, variable frame rate, portrait rotation flag"
codec = "hevc Main / aac"
container = "mov"
tier = "small"
file = "phone/iphone_hevc_vfr_rot90.mov"
video = true
audio = true
expect = "pass"
issue = "#480"
generate = "-f lavfi -i testsrc2=s={size}:r=60:d={S} {A} -vf settb=1/90000,setpts=PTS+0.004*sin(N)/TB -fps_mode vfr -enc_time_base:v 1/90000 -c:v libx265 -preset ultrafast -x265-params log-level=error -tag:v hvc1 -video_track_timescale 90000 -c:a aac -ac 2 -shortest"
post = "rotate:90"

