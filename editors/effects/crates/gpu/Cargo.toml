[package]
name = "redrob-effects-gpu"
description = "The GPU compositor (wgpu compute): layer transforms, masks/mattes, the 38 blend modes, motion blur, bit-depth quantisation and GPU effects, with the CPU renderer as the reference"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
redrob-effects-time = { workspace = true }
redrob-effects-geom = { workspace = true }
redrob-effects-color = { workspace = true }
redrob-effects-project = { workspace = true }
redrob-effects-raster = { workspace = true }
redrob-effects-effects = { workspace = true }
redrob-effects-render = { workspace = true }
redrob-effects-keyframe = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
log = { workspace = true }
web-time = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = { workspace = true }

[dev-dependencies]
redrob-effects-text = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
