[package]
name = "redrob-effects-script"
description = "Redrob Film scripting: JavaScript (boa) with an After Effects-style object model (app, project, CompItem, Layer, Property…) over the engine's undoable commands"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
redrob-effects-engine = { workspace = true }
redrob-effects-project = { workspace = true }
redrob-effects-keyframe = { workspace = true }
redrob-effects-time = { workspace = true }
redrob-effects-render = { workspace = true }
redrob-effects-path = { workspace = true }
serde_json = { workspace = true }
boa_engine = { workspace = true }
web-time = { workspace = true }

# On the web, boa's clock and Math.random need the browser (getrandom `wasm_js`, web-time).
[target.'cfg(target_arch = "wasm32")'.dependencies]
boa_engine = { workspace = true, features = ["js"] }

[dev-dependencies]
redrob-effects-expr = { workspace = true }
redrob-effects-psd = { workspace = true }
