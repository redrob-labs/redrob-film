[package]
name = "redrob-effects-host"
description = "Builds a fully wired Redrob Film session: media decoding (Redrob Film codecs), importer, the expression engine and scripting"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
redrob-effects-engine = { workspace = true }
redrob-effects-project = { workspace = true }
log = { workspace = true }
redrob-effects-media = { workspace = true }
redrob-effects-expr = { workspace = true }
redrob-effects-script = { workspace = true }
redrob-effects-export = { workspace = true }
redrob-effects-plugin = { workspace = true }

# WebAssembly effect plug-ins run in wasmi on native builds.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
redrob-effects-plugin = { workspace = true, features = ["wasm"] }

[dev-dependencies]
serde_json = { workspace = true }
redrob-effects-psd = { workspace = true }
redrob-effects-svg = { workspace = true }
redrob-effects-pdf = { workspace = true }
redrob-effects-raster = { workspace = true }
redrob-effects-time = { workspace = true }
redrob-effects-interchange = { workspace = true }
image = { workspace = true }
gif = { workspace = true }
exr = { workspace = true }
rayon = { workspace = true }
