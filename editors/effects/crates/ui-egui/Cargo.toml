[package]
name = "redrob-effects-ui-egui"
description = "The Redrob Film egui frontend (swappable): docking panels, composition viewer, timeline, effect controls, control channel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
craft-ui = { workspace = true }
redrob-effects-time = { workspace = true }
redrob-effects-geom = { workspace = true }
redrob-effects-color = { workspace = true }
redrob-effects-keyframe = { workspace = true }
redrob-effects-project = { workspace = true }
redrob-effects-path = { workspace = true }
redrob-effects-text = { workspace = true }
redrob-effects-render = { workspace = true }
redrob-effects-engine = { workspace = true }
redrob-effects-gpu = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
rayon = { workspace = true }
web-time = { workspace = true }
kurbo = { workspace = true }
image = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sys-locale = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["eframe", "wgpu"] }
pollster = "0.4"
redrob-effects-host = { workspace = true }
exr = { workspace = true }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
