[package]
name = "redrob-effects-export"
description = "Render Queue jobs and output modules: H.264 MP4 (+AAC), ProRes and uncompressed MOV (+PCM) via Redrob Film, HEVC / AV1 MP4 (+AAC) and WebM (VP9 or AV1 + Opus) via Redrob Film encoders, PNG/JPEG/TIFF/EXR sequences, animated GIF, WAV/AIFF"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
redrob-effects-time = { workspace = true }
redrob-effects-project = { workspace = true }
redrob-effects-raster = { workspace = true }
redrob-effects-render = { workspace = true }
redrob-film-h264enc = { workspace = true }
redrob-film-prores = { workspace = true }
redrob-film-aac = { workspace = true }
redrob-film-isobmff = { workspace = true }
redrob-effects-opusenc = { workspace = true }
redrob-effects-vp9enc = { workspace = true }
redrob-effects-hevcenc = { workspace = true }
redrob-effects-av1enc = { workspace = true }
image = { workspace = true, features = ["png", "jpeg", "tiff", "exr"] }
gif = { workspace = true }
rayon = { workspace = true }
web-time = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

[dev-dependencies]
redrob-effects-media = { workspace = true }
redrob-effects-effects = { workspace = true }
redrob-effects-color = { workspace = true }
redrob-film-opus = { workspace = true }
redrob-film-vp9 = { workspace = true }
redrob-effects-keyframe = { workspace = true }
