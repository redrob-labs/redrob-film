[package]
name = "redrob-effects-expr"
description = "After Effects-compatible expressions: a boa JavaScript runtime with the AE object model (thisComp, thisLayer, wiggle, loopOut, valueAtTime…) and array maths"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
redrob-effects-time = { workspace = true }
redrob-effects-geom = { workspace = true }
redrob-effects-keyframe = { workspace = true }
serde_json = { workspace = true }
redrob-effects-project = { workspace = true }
redrob-effects-path = { workspace = true }
redrob-effects-render = { workspace = true }
boa_engine = { workspace = true }

# On the web, boa's clock and Math.random need the browser (getrandom `wasm_js`, web-time).
[target.'cfg(target_arch = "wasm32")'.dependencies]
boa_engine = { workspace = true, features = ["js"] }

[dev-dependencies]
redrob-effects-color = { workspace = true }
redrob-effects-effects = { workspace = true }
redrob-effects-text = { workspace = true }
