[package]
name = "redrob-effects-render"
description = "The CPU compositor: property evaluation, layer sources (solids, footage, text, shapes, precomps), masks, effects, track mattes, 2D/3D transforms, motion blur and blending"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
redrob-effects-time = { workspace = true }
redrob-effects-geom = { workspace = true }
redrob-effects-color = { workspace = true }
redrob-effects-keyframe = { workspace = true }
redrob-effects-project = { workspace = true }
redrob-effects-raster = { workspace = true }
redrob-effects-path = { workspace = true }
redrob-effects-text = { workspace = true }
redrob-effects-effects = { workspace = true }
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
redrob-effects-model = { workspace = true }
kurbo = { workspace = true }
rayon = { workspace = true }
web-time = { workspace = true }
serde = { workspace = true }
log = { workspace = true }
