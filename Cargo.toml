[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask", "crafts/effectcraft/crates/*"]
default-members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/redrob-labs/redrob-film"

[workspace.dependencies]
# internal
redrob-film-time = { path = "crates/time" }
redrob-film-geom = { path = "crates/geom" }
redrob-film-color = { path = "crates/color" }
redrob-film-bitstream = { path = "crates/bitstream" }
redrob-film-isobmff = { path = "crates/isobmff" }
redrob-film-matroska = { path = "crates/matroska" }
redrob-film-mxf = { path = "crates/mxf" }
redrob-film-cfb = { path = "crates/cfb" }
redrob-film-mpegts = { path = "crates/mpegts" }
redrob-film-mpeg2v = { path = "crates/mpeg2v" }
redrob-film-ac3 = { path = "crates/ac3" }
redrob-film-ogg = { path = "crates/ogg" }
redrob-film-h264 = { path = "crates/h264" }
redrob-film-hevc = { path = "crates/hevc" }
redrob-film-vp9 = { path = "crates/vp9" }
redrob-film-prores = { path = "crates/prores" }
redrob-film-dnx = { path = "crates/dnx" }
redrob-film-apv = { path = "crates/apv" }
redrob-film-av1 = { path = "crates/av1" }
redrob-film-aac = { path = "crates/aac" }
redrob-film-opus = { path = "crates/opus" }
redrob-film-h264enc = { path = "crates/h264enc" }
redrob-film-audio-dsp = { path = "crates/audio-dsp" }
redrob-film-frame = { path = "crates/frame" }
redrob-film-media = { path = "crates/media" }
redrob-film-codecs = { path = "crates/codecs" }
redrob-film-project = { path = "crates/project" }
redrob-film-edit = { path = "crates/edit" }
redrob-film-interchange = { path = "crates/interchange" }
redrob-film-text = { path = "crates/text" }
redrob-film-captions = { path = "crates/captions" }
redrob-film-speech = { path = "crates/speech" }
redrob-film-tts = { path = "crates/tts" }
redrob-film-tts-text = { path = "crates/tts-text" }
redrob-film-render = { path = "crates/render" }
redrob-film-gpu = { path = "crates/gpu" }
redrob-film-scopes = { path = "crates/scopes" }
redrob-film-export = { path = "crates/export" }
redrob-film-format = { path = "crates/format" }
redrob-film-engine = { path = "crates/engine" }
redrob-film-ui-egui = { path = "crates/ui-egui" }
redrob-film-automation = { path = "crates/automation" }
redrob-film-platform = { path = "crates/platform" }
redrob-film-testkit = { path = "crates/testkit" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
rayon = "1"
proptest = "1"
roxmltree = "0.21"
sha2 = "0.10"

# ui
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"
# >>> effectcraft (generated by tools/merge_effectcraft.py) deps
redrob-effects-time = { path = "crafts/effectcraft/crates/time" }
redrob-effects-geom = { path = "crafts/effectcraft/crates/geom" }
redrob-effects-color = { path = "crafts/effectcraft/crates/color" }
redrob-effects-raster = { path = "crafts/effectcraft/crates/raster" }
redrob-effects-path = { path = "crafts/effectcraft/crates/path" }
redrob-effects-keyframe = { path = "crafts/effectcraft/crates/keyframe" }
redrob-effects-project = { path = "crafts/effectcraft/crates/project" }
redrob-effects-text = { path = "crafts/effectcraft/crates/text" }
redrob-effects-effects = { path = "crafts/effectcraft/crates/effects" }
redrob-effects-track = { path = "crafts/effectcraft/crates/track" }
redrob-effects-segment = { path = "crafts/effectcraft/crates/segment" }
redrob-effects-model = { path = "crafts/effectcraft/crates/model" }
redrob-effects-render = { path = "crafts/effectcraft/crates/render" }
redrob-effects-gpu = { path = "crafts/effectcraft/crates/gpu" }
redrob-effects-media = { path = "crafts/effectcraft/crates/media" }
redrob-effects-export = { path = "crafts/effectcraft/crates/export" }
redrob-effects-expr = { path = "crafts/effectcraft/crates/expr" }
redrob-effects-lottie = { path = "crafts/effectcraft/crates/lottie" }
redrob-effects-interchange = { path = "crafts/effectcraft/crates/interchange" }
redrob-effects-pdf = { path = "crafts/effectcraft/crates/pdf" }
redrob-effects-psd = { path = "crafts/effectcraft/crates/psd" }
redrob-effects-vp9enc = { path = "crafts/effectcraft/crates/vp9enc" }
redrob-effects-svg = { path = "crafts/effectcraft/crates/svg" }
redrob-effects-engine = { path = "crafts/effectcraft/crates/engine" }
redrob-effects-host = { path = "crafts/effectcraft/crates/host" }
redrob-effects-ui-egui = { path = "crafts/effectcraft/crates/ui-egui" }
redrob-effects-automation = { path = "crafts/effectcraft/crates/automation" }
redrob-effects-opusenc = { path = "crafts/effectcraft/crates/opusenc" }
redrob-effects-script = { path = "crafts/effectcraft/crates/script" }
redrob-effects-hevcenc = { path = "crafts/effectcraft/crates/hevcenc" }
redrob-effects-av1enc = { path = "crafts/effectcraft/crates/av1enc" }
redrob-effects-plugin = { path = "crafts/effectcraft/crates/plugin" }
web-time = "1"
gif = "0.14"
boa_engine = { version = "0.22", default-features = false }
wasmi = { version = "2", default-features = false, features = ["std", "validate", "wat", "deterministic", "portable-dispatch"] }
kurbo = { version = "0.13", features = ["serde"] }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
skrifa = { version = "0.44", default-features = false, features = ["std"] }
harfrust = { version = "0.12", default-features = false, features = ["std"] }
exr = "1.74"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
wgpu = { version = "30.0.1", features = ["fragile-send-sync-non-atomic-wasm"] }
bytemuck = "1"
pollster = "0.4"
craft-ui = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "5c874d51eeb3de70e735c8ce87a59a7dedd47675", features = ["serde"] }  # upstream library pin
cpal = "0.16"
sys-locale = "0.3"
# <<< effectcraft deps

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

# Codec hot loops: debug-build tests (RFC/oracle vectors) are minutes slower below opt-level 3.
[profile.dev.package.redrob-film-h264]
opt-level = 3

[profile.dev.package.redrob-film-h264enc]
opt-level = 3

[profile.dev.package.redrob-film-hevc]
opt-level = 3

[profile.dev.package.redrob-film-prores]
opt-level = 3

[profile.dev.package.redrob-film-dnx]
opt-level = 3

[profile.dev.package.redrob-film-apv]
opt-level = 3

[profile.dev.package.redrob-film-av1]
opt-level = 3

[profile.dev.package.redrob-film-aac]
opt-level = 3

# Audio effects: realtime-factor tests and long convolution / spectral runs.
[profile.dev.package.redrob-film-audio-dsp]
opt-level = 3

[profile.dev.package.redrob-film-mxf]
opt-level = 3

[profile.dev.package.redrob-film-opus]
opt-level = 3

[profile.dev.package.redrob-film-vp9]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# Pull-request CI (`.github/workflows/ci.yml`): clippy and tests of our crates only, with every
# dependency at opt-level 0. `dev` compiles the dependency graph (egui, wgpu, both craft trees) at
# opt-level 2, which is what made a CI run take tens of minutes; tests that need speed (the codec
# oracle vectors) are not part of the PR gate.
[profile.ci]
inherits = "dev"
opt-level = 0
debug = "line-tables-only"
incremental = false

[profile.ci.package."*"]
opt-level = 0

# >>> effectcraft (generated by tools/merge_effectcraft.py) profiles
[profile.dev.package.redrob-effects-raster]
opt-level = 3
[profile.dev.package.redrob-effects-render]
opt-level = 3
[profile.dev.package.redrob-effects-gpu]
opt-level = 3
[profile.dev.package.redrob-effects-effects]
opt-level = 3
[profile.dev.package.redrob-effects-track]
opt-level = 3
[profile.dev.package.redrob-effects-path]
opt-level = 3
[profile.dev.package.redrob-effects-media]
opt-level = 3
[profile.dev.package.redrob-effects-opusenc]
opt-level = 3
[profile.dev.package.redrob-effects-export]
opt-level = 3
[profile.dev.package.redrob-effects-vp9enc]
opt-level = 3
[profile.dev.package.redrob-effects-hevcenc]
opt-level = 3
[profile.dev.package.redrob-effects-av1enc]
opt-level = 3
# <<< effectcraft profiles
