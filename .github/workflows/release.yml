# Release pipeline: a `vX.Y.Z` tag pushed on `main` builds the three release targets (Linux
# x86_64 tar.gz + deb, macOS universal dmg, Windows x64 portable.zip + msi) and publishes the
# GitHub Release "Redrob Film vX.Y.Z" through the shared redrob-labs publish workflow. See
# docs/releasing.md.
#
# The tag must equal the Cargo.toml version; the validate job fails otherwise. It also checks
# formatting, the upstream pins and the notices; clippy and the tests ran on the pull request
# (.github/workflows/ci.yml) and are not repeated here. The jobs that sign
# (macOS, Windows) and the one that drafts the GitHub Release run in the `release` environment.
# Signing secrets are the redrob-labs organization's (Apple Developer ID certificate + App Store
# Connect API key for notarization). Every secret is optional: missing ones produce unsigned
# artifacts and a warning, never a failed build. A manual dispatch is a dry run: it builds every
# job and drafts nothing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override for a test run, e.g. 0.7.0-rc.1 (empty: Cargo.toml)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a run mid-notarization or mid-upload; a newer push waits its turn.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  REDROB_FILM_BUILD_SHA: ${{ github.sha }}
  INPUT_VERSION: ${{ inputs.version }}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      date: ${{ steps.v.outputs.date }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Formatting
        run: cargo fmt --all --check
      - name: Upstream pins, notices, brand
        run: |
          python3 scripts/check_upstream_boundary.py
          python3 scripts/check_no_upstream_services.py
          python3 scripts/check_brand.py
      - name: Changelog has this version
        # A dry run with a version override is not a release, so it needs no changelog entry.
        if: inputs.version == ''
        run: |
          . packaging/env.sh
          v="${INPUT_VERSION#v}"
          v="${v:-$VERSION}"
          grep -Fq "## $v" ROADMAP.md || { echo "::error::ROADMAP.md has no '## $v' section"; exit 1; }
      - id: v
        name: Resolve version
        run: |
          . packaging/env.sh
          v="${INPUT_VERSION#v}"
          v="${v:-$VERSION}"
          if ! printf '%s' "$v" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "::error::'$v' is not a version like 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the Cargo.toml version $v"
            exit 1
          fi
          case "$v" in *-*) pre=true ;; *) pre=false ;; esac
          {
            echo "version=$v"
            echo "date=$(date -u +%Y-%m-%d)"
            echo "prerelease=$pre"
          } >>"$GITHUB_OUTPUT"
          echo "### Redrob Film v$v (\`${GITHUB_SHA::9}\`)" >>"$GITHUB_STEP_SUMMARY"
      # The launcher icon: the 512 px app icon as one more release asset, named in
      # redrob-launcher.json (`icon`) by the shared publish job so Redrob Launcher's catalog shows
      # this release's own logo. Uploaded under the `release-*` prefix the publish job collects.
      - name: Launcher icon
        run: |
          mkdir -p "$RUNNER_TEMP/launcher-icon"
          cp assets/app-icon/redrob-film-512.png "$RUNNER_TEMP/launcher-icon/redrob-film.png"
      - uses: actions/upload-artifact@v4
        with:
          name: release-launcher-icon
          path: ${{ runner.temp }}/launcher-icon/redrob-film.png
          if-no-files-found: error

  macos:
    name: macOS universal
    needs: validate
    # Larger hosted runner (5-core M2 Pro, billed per minute); the Team plan offers it without setup.
    runs-on: macos-15-xlarge
    environment: release
    env:
      REDROB_FILM_VERSION: ${{ needs.validate.outputs.version }}
      REDROB_FILM_BUILD_DATE: ${{ needs.validate.outputs.date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: abb83316d96aa59c1cf64784289e378fe9fa5695 # craft-fonts: bump deliberately
          path: craft-fonts
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos-universal
      - name: Apply version override
        if: inputs.version != ''
        run: cargo xtask version set "$REDROB_FILM_VERSION"
      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
        run: packaging/macos/import-cert.sh
      - name: Build, sign, notarize
        env:
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
          APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_NOTARY_API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: packaging/macos/package.sh --arch universal
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/release/*
          if-no-files-found: error
      - name: Remove temporary keychain
        if: always()
        run: |
          if [ -n "${MACOS_KEYCHAIN:-}" ]; then security delete-keychain "$MACOS_KEYCHAIN" || true; fi

  windows:
    name: Windows x64
    needs: validate
    # The organization's 16-core larger runner (Windows Server 2025 image, billed per minute).
    runs-on: redrob-windows-16
    # `release` is the environment the organization's federated credential names
    # (repo:redrob-labs@<org id>/<repo>@<id>:environment:release); any other name is refused.
    environment: release
    permissions:
      contents: read
      # The OIDC token `azure/login` exchanges for the Artifact Signing credential.
      id-token: write
    env:
      REDROB_FILM_VERSION: ${{ needs.validate.outputs.version }}
      REDROB_FILM_BUILD_DATE: ${{ needs.validate.outputs.date }}
      # Plain IDs (not credentials); here so the login step can be skipped when signing is not set up.
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
      CRAFT_FONTS_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: abb83316d96aa59c1cf64784289e378fe9fa5695 # craft-fonts: bump deliberately
          path: craft-fonts
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows-x64
      - name: Apply version override
        if: inputs.version != ''
        shell: bash
        run: cargo xtask version set "$REDROB_FILM_VERSION"
      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build and stage
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Arch x64 -BuildOnly

      # The login comes after the build on purpose: the OpenID Connect token is short-lived and a
      # long build left signtool without a usable credential (it then waited on a browser).
      - name: Log in to Azure (OIDC)
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign the executables
        uses: redrob-labs/.github/actions/sign-windows@main
        with:
          files: target/windows-package/x64/*.exe
          description: Redrob Film
          url: https://github.com/redrob-labs/redrob-film
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          account: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          cert-profile: ${{ secrets.ARTIFACT_SIGNING_CERT_PROFILE }}

      - name: Package (MSI, portable zip)
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Arch x64 -SkipBuild

      - name: Sign the installer
        uses: redrob-labs/.github/actions/sign-windows@main
        with:
          files: dist/release/*.msi
          description: Redrob Film
          url: https://github.com/redrob-labs/redrob-film
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          account: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          cert-profile: ${{ secrets.ARTIFACT_SIGNING_CERT_PROFILE }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: dist/release/*
          if-no-files-found: error

  linux:
    name: Linux x86_64
    needs: validate
    # The oldest GitHub-hosted image, so the binaries only need glibc >= 2.35 (Ubuntu 22.04+,
    # Debian 12+). See docs/releasing.md.
    runs-on: ubuntu-22.04
    # No `environment: release`: this job signs nothing, so it gets no release secrets.
    env:
      REDROB_FILM_VERSION: ${{ needs.validate.outputs.version }}
      REDROB_FILM_BUILD_DATE: ${{ needs.validate.outputs.date }}
      NFPM_VERSION: 2.47.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: abb83316d96aa59c1cf64784289e378fe9fa5695 # craft-fonts: bump deliberately
          path: craft-fonts
      - name: Install build and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libasound2-dev \
            desktop-file-utils appstream
          curl -fsSL -o "$RUNNER_TEMP/nfpm.deb" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/nfpm.deb"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux-x86_64
      - name: Apply version override
        if: inputs.version != ''
        run: cargo xtask version set "$REDROB_FILM_VERSION"
      - name: Build and package (tar.gz, deb)
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: packaging/linux/package.sh
      - name: Check the packages
        run: |
          dpkg-deb --info dist/release/*.deb
          dpkg-deb --contents dist/release/*.deb | grep -E 'usr/bin/redrob-film$|metainfo|applications'
          ldd target/release/redrob-film
          # Exactly the two Linux assets the launcher and the in-app updater (apps/redrob-film-app/src/update.rs) expect.
          test -s "dist/release/redrob-film-$REDROB_FILM_VERSION-linux-x86_64.tar.gz"
          test -s "dist/release/redrob-film-$REDROB_FILM_VERSION-linux-x86_64.deb"
          extra="$(find dist/release -mindepth 1 -maxdepth 1 -printf '%f\n' | grep -vE '^redrob-film-.*-linux-x86_64\.(tar\.gz|deb)$' || true)"
          if [ -n "$extra" ]; then echo "::error::unexpected Linux asset: $extra"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64
          path: dist/release/*
          if-no-files-found: error

  publish:
    needs: [validate, macos, windows, linux]
    if: always() && github.ref_type == 'tag' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped')
    uses: redrob-labs/.github/.github/workflows/release-publish.yml@main
    permissions:
      contents: write
    with:
      version: ${{ needs.validate.outputs.version }}
      title: Redrob Film
      launcher_manifest: true
      launcher_icon: redrob-film.png
      publish: true
