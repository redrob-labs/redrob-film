# The one pull-request workflow. `checks` (seconds) runs the repository scripts: brand, upstream
# boundary, packaging and the release-target matrix. `changes` decides whether the PR touches any
# Rust input at all; `rust` runs formatting, clippy and the FAST tests of OUR crates (the shell
# `filmcraft`, the engine and the egui UI): library and binary unit tests with `--profile ci` (root
# Cargo.toml: every dependency at opt-level 0, no incremental), minus the slow ffprobe export and
# multicam suites. The full suite (the ~60 egui_kittest UI binaries in crates/ui-egui/tests and the
# skipped modules) runs when CI is started by hand (Actions > CI > Run workflow), on Linux in `rust`
# and on macOS and Windows in `rust-desktop`: run it once before a release. The release workflow
# does not repeat any of this; PR policy is the org-wide workflow.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Our crates and the shell. Not `--workspace`: that would lint and test the effectcraft subtree too.
  OUR_CRATES: -p redrob-film-app -p redrob-film-ui-egui -p redrob-film-engine

jobs:
  checks:
    name: brand, boundary, packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # check_upstream_boundary.py walks back to the upstream base commit
      - name: Repository scripts
        run: |
          python3 scripts/check_brand.py
          python3 scripts/check_upstream_boundary.py
          python3 scripts/check_no_upstream_services.py
          python3 tools/rebrand_crafts.py --check
          # A version bump that leaves Cargo.lock behind passes every PR check and only fails the
          # release build (`--locked`). Resolving the lock here takes seconds and runs on every PR.
          cargo metadata --locked --format-version 1 >/dev/null
          # release.yml refuses a version with no ROADMAP section; catch it on the release PR.
          if [ "${{ github.base_ref }}" = "main" ]; then
            . packaging/env.sh
            grep -Fq "## $VERSION" ROADMAP.md || { echo "::error::ROADMAP.md has no '## $VERSION' section"; exit 1; }
          fi
      - name: Packaging
        run: |
          sudo apt-get install -y --no-install-recommends shellcheck desktop-file-utils libxml2-utils >/dev/null
          shellcheck packaging/*.sh packaging/*/*.sh
          python3 packaging/linux/test_install.py
          xmllint --noout packaging/windows/redrob-film.wxs packaging/macos/*.plist* packaging/linux/*.xml*
          # Windows Installer needs Icon ids ending in .ico or .exe, or shortcuts show a blank icon.
          if grep -oE '<Icon Id="[^"]*"' packaging/windows/redrob-film.wxs | grep -vE '\.(ico|exe)"$'; then
            echo "::error::Icon Id must end in .ico or .exe"; exit 1
          fi
          desktop-file-validate packaging/linux/ai.redrob.film.desktop
      - name: Release asset matrix
        # The three targets, and nothing else: the launcher manifest and apps/redrob-film-app/src/update.rs name these files.
        run: |
          grep -Fq -- '--arch universal' .github/workflows/release.yml
          grep -Fq -- '-Arch x64 -SkipBuild' .github/workflows/release.yml
          grep -Fq 'FORMATS="deb tar"' packaging/linux/package.sh
          if grep -niE 'appimage|zsync|flatpak|\brpm\b|arm64|i686|windows-x86|ubuntu-22\.04-arm|riscv|freebsd' .github/workflows/release.yml packaging/linux/package.sh packaging/windows/package.ps1; then
            echo "::error::a removed release target is back (see docs/releasing.md)"; exit 1
          fi

  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.rs.outputs.heavy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # the PR merge commit and its first parent (the base branch tip)
      - name: Did any Rust input change?
        id: rs
        run: |
          # HEAD is GitHub's merge of the PR into its base, so HEAD^1..HEAD is exactly the PR's
          # change. A three-dot diff against the base needs a merge base, which a shallow clone
          # lacks: git exits 128 and every PR, docs-only included, ran the full suite.
          paths=('*.rs' '*.toml' Cargo.lock '*.js' '*.json' '*.tsv' '*.wgsl' '*.ttf' assets .github/workflows/ci.yml)
          if [ "${{ github.event_name }}" != pull_request ]; then
            heavy=true
          # A release PR into main carries code that already passed here on its way into develop.
          elif [ "${{ github.base_ref }}" = main ]; then
            heavy=false
          # Docs, packaging or anything else that is not a Rust input.
          elif git diff --quiet HEAD^1 HEAD -- "${paths[@]}"; then
            heavy=false
          # Only `version = "x.y.z"`, a build profile's `codegen-units` / `lto`, or `# ` comment
          # lines: a release bump or a profile tweak, no code the tests see.
          elif ! git diff -U0 HEAD^1 HEAD -- "${paths[@]}" | grep -E '^[-+][^-+]' | grep -qvE '^[-+](version = "[0-9.]+"|codegen-units = [0-9]+|lto = ("[a-z]+"|true|false)|#( .*)?)$'; then
            heavy=false
          else
            heavy=true
          fi
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"

  rust:
    # Required check: keep this name. Skipped (counts as passing) when `changes` says no Rust input changed.
    name: fmt, clippy, test (profile ci)
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the system headers winit, cpal and rfd need
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libasound2-dev libgtk-3-dev fonts-noto-cjk
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-profile
      # Pull requests compile once (the release build compiles again, on every target). Formatting,
      # test-code lint and the tests run by hand (Actions > CI > Run workflow) before a release.
      - name: Compile (pull request)
        if: github.event_name == 'pull_request'
        run: |
          # shellcheck disable=SC2086 # OUR_CRATES is a list of flags on purpose
          cargo clippy $OUR_CRATES --locked --profile ci -- -D warnings
      - name: Formatting (by hand)
        if: github.event_name != 'pull_request'
        run: cargo fmt --all --check
      - name: Clippy and full tests (by hand)
        if: github.event_name != 'pull_request'
        run: |
          # shellcheck disable=SC2086
          cargo clippy $OUR_CRATES --all-targets --locked --profile ci -- -D warnings
          cargo test $OUR_CRATES --locked --profile ci

  rust-desktop:
    name: clippy, test (profile ci) on ${{ matrix.os }}
    # The full suite on macOS and Windows, by hand only (Actions > CI > Run workflow): ~40 min of
    # macOS/Windows runners is too slow for every PR. Run it once before a release.
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-profile
      - name: Clippy
        run: |
          # shellcheck disable=SC2086 # OUR_CRATES is a list of flags on purpose
          cargo clippy $OUR_CRATES --all-targets --locked --profile ci -- -D warnings
      - name: Tests
        run: |
          # shellcheck disable=SC2086
          cargo test $OUR_CRATES --locked --profile ci
