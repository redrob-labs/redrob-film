# Kdenlive 26.08 parity inventory, area 1: playback, monitors, scrubbing, JKL, audio playback,
# audio mixer, meters, waveforms, audio effects, scopes, proxies, timeline preview rendering.
#
# Source: the Kdenlive user manual at https://docs.kdenlive.org only (clean room, see
# film-gap/PARITY-RULES.md). One row per user-facing feature or option the manual lists.
# `film` rates Redrob Film today: full = the feature works as the manual describes (a different
# default key or menu location still counts), partial = a related or reduced version exists,
# none = nothing equivalent. `evidence` is our file:line or command id; `gap` says what is missing.

