# Weekly editor tasks: Redrob Film 0.3.0 vs Kdenlive 26.08.2
#
# One [[task]] per job an editor does in a normal week. Every task is run in both apps on the
# same corpus, and each gets a verdict (works / slow / broken / missing) backed by a number or a
# path under results/<app>/<task-id>/ (see film-gap/RULES.md).
#
# Fields
#   id, group, title, priority   priority 1 = the ten tasks that decide the round
#   steps                        what to do, in the app under test ("the app")
#   pass                         the pass criterion, numeric where possible
#   measure                      how to get the number on Linux, without reading images by eye
#   kdenlive_manual              the Kdenlive 26.08 manual page describing the feature
#   film_claim                   what our docs say (file:line under docs/), or "none"
#
# Kdenlive is observed as a black box: the manual, release notes and the running AppImage only.

[meta]
target = "Kdenlive 26.08.2 (official AppImage)"
ours = "Redrob Film 0.3.0 release binary"
display = ":0 (shared; never fullscreen, check the active window before every xdotool action)"
manual_base = "https://docs.kdenlive.org/en/"
task_count = 60

# Test media the corpus job must produce (names are referenced by the tasks below).
[meta.corpus]
"corpus/h264_1080p30_60s.mp4" = "H.264 High 8-bit 4:2:0 1920x1080 30 fps, AAC 48 kHz stereo 1 kHz tone at -12 dBFS, 60 s"
"corpus/h264_2160p30_60s.mp4" = "H.264 3840x2160 30 fps, AAC 48 kHz, 60 s, GOP 250"
"corpus/hevc_2160p30_30s.mov" = "HEVC Main 3840x2160 30 fps, AAC 48 kHz, 30 s"
"corpus/framecode_1080p25_60s.mp4" = "H.264 1080p25, a 32-cell black/white strip in the top 40 px encodes the frame number in binary (decodable with magick pixel reads); silent"
"corpus/sync_flash_beep_1080p25_30s.mp4" = "1080p25, a full white frame and a 10 ms 1 kHz beep at -6 dBFS once per second, both on the same frame"
"corpus/prores422_1080p25_10s.mov" = "ProRes 422 1080p25, PCM 48 kHz"
"corpus/dnxhr_hq_1080p25_10s.mxf" = "DNxHR HQ 1080p25 OP1a"
"corpus/vp9_1080p30_10s.webm" = "VP9 + Opus"
"corpus/av1_1080p30_10s.mkv" = "AV1 + Opus"
"corpus/mkv_2audio_1080p30_10s.mkv" = "H.264 + two audio streams: stream 1 = 440 Hz, stream 2 = 880 Hz"
"corpus/phone_vfr_hevc_20s.mov" = "variable frame rate HEVC (24-60 fps), AAC 48 kHz, rotation metadata 90"
"corpus/h264_10bit_422_1080p25_10s.mp4" = "H.264 High 4:2:2 10-bit (camera style)"
"corpus/tone_48k_stereo.wav" = "PCM 16-bit 48 kHz stereo 1 kHz sine at -12 dBFS, 60 s"
"corpus/tone_44k1_stereo.wav" = "PCM 16-bit 44.1 kHz stereo 1 kHz sine at -12 dBFS, 60 s"
"corpus/tone_500hz_48k.wav" = "PCM 48 kHz stereo 500 Hz sine at -12 dBFS, 60 s"
"corpus/music_44k1.mp3" = "MP3 44.1 kHz stereo, 60 s"
"corpus/speech_en_30s.wav" = "English read speech, 48 kHz mono, with reference transcript corpus/speech_en_30s.txt"
"corpus/subs_en.srt" = "12 cues, UTF-8, includes one two-line cue"
"corpus/still_1920.png" = "PNG 1920x1080 colour bars"
"corpus/seq_png/" = "100-frame PNG image sequence 0001.png..0100.png"
"corpus/lut_invert.cube" = "33-point 3D LUT that inverts RGB"
"corpus/overlap_project" = "per app (.kdenlive / .rfilm): A1 tone_48k_stereo.wav 0-30 s, A2 tone_500hz_48k.wav 10-40 s, V1 h264_1080p30_60s.mp4 0-40 s"
"corpus/edit_project" = "per app: 10 clips of framecode_1080p25_60s.mp4, each 4 s, butted on V1 with linked audio from tone_48k_stereo.wav on A1, 1080p25 48 kHz project"

[meta.measure]
needle = "Record the timeline/monitor region with `ffmpeg -f x11grab -framerate 60 -video_size WxH -i :0+X,Y` while a script drives `xdotool mousemove` in 20 px steps every 50 ms and logs `date +%s%N` per step; per captured frame find the needle column with magick (column with the needle colour); latency = time from mouse reaching x to the needle reaching x (p50/p95)."
frame = "Decode the frame number from the framecode strip with `magick <png> -crop 32x1+0+20 -depth 8 txt:` (cell lit = 1)."
audio = "`timeout 20 parec -d \"$(pactl get-default-sink).monitor\" --file-format=wav out.wav`; level with `sox out.wav -n stats` or `ffmpeg -i out.wav -af astats -f null -`; dropouts with `ffmpeg -i out.wav -af silencedetect=n=-60dB:d=0.01 -f null -`; pitch with `sox out.wav -n stat` (Rough frequency)."
files = "`ffprobe -v error -show_streams -show_format -of json`; frame compare with `ffmpeg -lavfi psnr` / `magick compare -metric AE`."
timing = "Wall clock from `date +%s%N` around the action, against the first screenshot/audio sample showing the effect."

# ---------------------------------------------------------------- playback

[[task]]
id = "PB-01"
group = "playback"
title = "Space starts playback quickly with sound"
priority = 1
steps = [
  "Open corpus/edit_project, park the playhead at 00:00:02:00.",
  "Start parec on the default sink monitor and the 60 fps x11grab of the program monitor.",
  "Press Space (log t0), wait 5 s, press Space again.",
]
pass = "First changed monitor frame within 500 ms of t0 AND first audio sample above -40 dBFS within 500 ms of t0."
measure = "x11grab frames: first frame whose decoded frame number differs from the parked one; parec WAV: first 10 ms window with RMS > -40 dBFS, both against the logged t0."
kdenlive_manual = "https://docs.kdenlive.org/en/user_interface/shortcuts.html#navigation-and-playback"
film_claim = "docs/monitors.md:47 (normal forward playback has sound); docs/performance.md:730 (program-monitor playback table)"

[[task]]
id = "PB-02"
group = "playback"
title = "1080p30 playback holds frame rate with no dropped frames"
priority = 1
steps = [
  "Put corpus/h264_1080p30_60s.mp4 on V1/A1 of a 1080p30 project.",
  "Record the program monitor at 60 fps for 20 s of playback from 00:00:05:00.",
]
pass = ">= 590 of 600 distinct frames shown in 20 s (<= 1.7% dropped), no frame shown longer than 100 ms."
measure = "Count distinct consecutive frames in the x11grab (ffmpeg mpdecimate or per-frame md5 of the monitor crop); max hold = longest run of identical captures x 16.7 ms."
kdenlive_manual = "https://docs.kdenlive.org/en/user_interface/monitors/project_monitor.html"
film_claim = "docs/performance.md:734 (H.264 1080p 191/1 shown/dropped in 8 s); docs/gaps.md:152 (Linux playback stutter #617)"

[[task]]
id = "PB-03"
group = "playback"
title = "J/K/L shuttle: speeds and direction"
priority = 2
steps = [
  "Open corpus/edit_project, park at 00:00:20:00.",
  "Press L, L, L (2 s each), K, then J, J (2 s each), K. Log each key time.",
]
pass = "Each L press raises forward speed (measured frames per second of timeline time rises by >= 1.4x per press); J plays backward (frame number decreases); K stops within 100 ms."
measure = "Decode frame numbers from the 60 fps capture; speed = slope of frame number vs capture time per segment."
kdenlive_manual = "https://docs.kdenlive.org/en/user_interface/shortcuts.html#navigation-and-playback"
film_claim = "docs/monitors.md:47 (L/J double speed up to 8x, K stops; other speeds play without sound)"

[[task]]
