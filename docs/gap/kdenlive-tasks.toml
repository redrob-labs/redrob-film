  "Open corpus/edit_project, park at frame 100.",
  "Press Right 10 times (150 ms apart), screenshot; press Left 25 times, screenshot; press Shift+Right once, screenshot.",
]
pass = "Displayed frame numbers are exactly 110, 85 and 110 (Shift+Right = +1 s = +25 frames); each step shows within 100 ms."
measure = "Decode the framecode strip from each screenshot (`import -window <win-id>`), timing from the 60 fps capture."
kdenlive_manual = "https://docs.kdenlive.org/en/cutting_and_assembling/editing.html#seeking-through-your-project"
film_claim = "docs/monitors.md:48 (left/right frame-step keys step the playhead)"

[[task]]
id = "PB-05"
group = "playback"
title = "Loop a zone / In-Out range"
priority = 2
steps = [
  "Open corpus/edit_project, set In at 00:00:04:00 and Out at 00:00:06:00 (I / O).",
  "Enable loop (Kdenlive: Loop Zone Ctrl+Shift+Space; ours: Program loop setting + Play In to Out). Record 8 s.",
]
pass = ">= 3 full loops in 8 s; every frame shown lies within frames 100..150; the jump from Out back to In takes <= 200 ms."
