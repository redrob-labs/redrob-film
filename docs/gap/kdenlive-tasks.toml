# ---------------------------------------------------------------- scrub

[[task]]
id = "SC-01"
group = "scrub"
title = "Needle follows the mouse when dragged on the timeline ruler"
priority = 1
steps = [
  "Open corpus/edit_project, zoom so the 40 s sequence fills the timeline width.",
  "Start a 60 fps x11grab of the timeline ruler + program monitor region.",
  "xdotool: press button 1 on the ruler at x0, move right 600 px in 20 px steps every 33 ms, then back, release. Log every step time.",
]
pass = "Needle lags the pointer by p50 <= 50 ms and p95 <= 100 ms; needle x within 2 px of pointer x once the pointer stops."
measure = "Needle column per captured frame (magick: column matching the needle colour in the ruler row) vs the logged pointer x/time."
kdenlive_manual = "https://docs.kdenlive.org/en/cutting_and_assembling/editing.html#seeking-through-your-project"
film_claim = "docs/performance.md:746 (drag-stop p50 103-281 ms for H.264 1080p); docs/ui-parity.md:28 (scrubbing 80%)"

