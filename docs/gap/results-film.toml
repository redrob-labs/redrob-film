# Redrob Film 0.3.0 (release binary) -- stage-2 results for docs/gap/kdenlive-tasks.toml, priority-1 tasks.
# Host: 32 cores, llvmpipe (no GPU, CPU compositor), :0 1920x1080 xfwm4, PulseAudio null sink "dcv" (Film -> ALSA default -> pulse).
# Window 1600x980, client area at +5,+56 (not maximised). Driven with the same XTest scripts as the Kdenlive run
# (xdrag.py / xkey.py, active window checked), plus the control port (127.0.0.1:9876) for setup and perf.stats.
# Evidence paths are relative to /home/ubuntu/workplace/film-gap/ (not in git).
# corpus/edit_project = results/film/projects/edit_project.rfilm: 1080p25 48 kHz sequence, framecode_tone_1080p25_60s.mov
# 0-40 s on V1/A1 (linked), Add Edit to All Tracks every 4 s = 10 x 4 s clips, same content as the Kdenlive project.
# Timeline fit to the 40 s sequence: 17.149 px/s = 0.686 px/frame (Kdenlive 1.051), frame 0 at screen x 743.4.
# Film scans use tools/film_capscan.py (capscan.py with Film's needle colour: blue #507FFF line, white while snapped)
# and the unchanged scrub_lat.py / audwin.py / distinct.py / fcdecode.py; film_settle.py adds a snap-proof settle
# (target = control-port playheadFrame) and the control-port lag (perf.stats monitor.frame vs playheadFrame, ~60 ms poll).
# Snap is on (default): a release next to an edit snaps the playhead to it (817 px -> frame 100 at 812 px).
# Latency numbers include one 60 fps capture interval (~8 ms mean quantisation) and the xfwm4 compositor.
# All runs happen while the app repaints continuously at ~80-120 fps and keeps ~6-9 cores busy (see results/film/idle_repaint.md).

