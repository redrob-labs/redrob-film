[package]
name = "redrob-film-ui-egui"
description = "The Redrob Film egui frontend (swappable): panels, docking, timeline, monitors, control channel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
redrob-film-interchange = { workspace = true }
redrob-film-time = { workspace = true }
redrob-film-geom = { workspace = true }
redrob-film-color = { workspace = true }
redrob-film-frame = { workspace = true }
redrob-film-media = { workspace = true }
redrob-film-project = { workspace = true }
redrob-film-tts = { workspace = true }
redrob-film-edit = { workspace = true }
redrob-film-render = { workspace = true }
redrob-film-text = { workspace = true }
redrob-film-audio-dsp = { workspace = true }
redrob-film-engine = { workspace = true }
redrob-film-export = { workspace = true }
redrob-film-gpu = { workspace = true }
redrob-film-scopes = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
rayon = { workspace = true }
web-time = "1"
# The Redrob lockup (PNG, assets/brand/) for the About dialog and Home screen.
image = { version = "0.25", default-features = false, features = ["png"] }

# Thread/process CPU clocks for frame-job profiling (safe wrappers; see frames.rs).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "time"] }
# the same clocks on Windows (GetThreadTimes / GetProcessTimes behind a safe API; MIT OR Apache-2.0)
[target.'cfg(windows)'.dependencies]
cpu-time = "1"

[dev-dependencies]
pollster = "0.4"
redrob-film-codecs = { workspace = true }
# the bench registers OS hardware decoders as the desktop app does (dev-dependency only: ui-egui
# itself stays OS-independent and web-portable)
redrob-film-platform = { workspace = true }
egui_kittest = { workspace = true, features = ["eframe", "wgpu"] }

# build.rs bakes contributors/contributors.json into the binary (About ▸ Contributors).
[build-dependencies]
serde_json = { workspace = true }
toml = "1"
