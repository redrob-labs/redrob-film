[package]
name = "redrob-film-engine"
description = "Redrob Film engine façade: session, command registry, history, media pool"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# Speech-to-text with Whisper (candle, CPU). Off by default and in wasm builds.
whisper = ["redrob-film-speech/whisper"]
# Speech-model downloads over HTTPS.
speech-download = ["redrob-film-speech/download"]
# Natural voices for Text to Speech: Kokoro-82M on candle (CPU) and their download.
neural-voices = ["redrob-film-tts/kokoro", "speech-download"]

[dependencies]
redrob-film-time = { workspace = true }
redrob-film-geom = { workspace = true }
redrob-film-color = { workspace = true }
redrob-film-frame = { workspace = true }
redrob-film-media = { workspace = true }
redrob-film-codecs = { workspace = true }
redrob-film-project = { workspace = true }
redrob-film-edit = { workspace = true }
redrob-film-render = { workspace = true }
redrob-film-scopes = { workspace = true }
redrob-film-text = { workspace = true }
redrob-film-audio-dsp = { workspace = true }
redrob-film-export = { workspace = true }
redrob-film-mxf = { workspace = true }
redrob-film-format = { workspace = true }
redrob-film-interchange = { workspace = true }
redrob-film-captions = { workspace = true }
redrob-film-speech = { workspace = true }
redrob-film-tts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
web-time = "1"
# Project archives (.tar.gz / .zip): the pure-Rust deflate backend
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
redrob-film-testkit = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
