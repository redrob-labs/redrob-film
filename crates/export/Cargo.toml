[package]
name = "redrob-film-export"
description = "Export pipeline: parallel render → encode → mux, presets, progress/cancel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
redrob-film-time = { workspace = true }
redrob-film-frame = { workspace = true }
redrob-film-color = { workspace = true }
redrob-film-media = { workspace = true }
redrob-film-project = { workspace = true }
redrob-film-render = { workspace = true }
redrob-film-audio-dsp = { workspace = true }
redrob-film-geom = { workspace = true }
redrob-film-text = { workspace = true }
redrob-film-isobmff = { workspace = true }
redrob-film-prores = { workspace = true }
redrob-film-dnx = { workspace = true }
redrob-film-apv = { workspace = true }
redrob-film-mxf = { workspace = true }
redrob-film-aac = { workspace = true }
redrob-film-h264enc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
web-time = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "tiff", "bmp", "webp"] }

[dev-dependencies]
redrob-film-testkit = { workspace = true }
redrob-film-codecs = { workspace = true }
