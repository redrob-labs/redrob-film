[package]
name = "redrob-film-automation"
description = "MCP server (rmcp) over the Redrob Film engine, plus a bridge to the running app's control channel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
redrob-film-engine = { workspace = true }
redrob-film-handoff = { workspace = true }
redrob-effects-engine = { workspace = true }
redrob-effects-host = { workspace = true }
redrob-film-time = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync", "net", "io-util", "time"] }
base64 = "0.22"
schemars = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
